{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="bn-page-hero">
    <h1><i class="fa fa-user-plus"></i> Create <span class="gold">Account</span></h1>
    <p>Join BookNest and start sharing or discovering books today</p>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
            <div class="bn-form-card">
                <h4 style="font-weight:800;color:var(--navy,#0d1b2a);margin-bottom:24px;">
                    <i class="fa fa-user-circle" style="color:var(--teal,#00b4d8);"></i> Your Information
                </h4>
                <form method="post" autocomplete="off" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>Full Name *</label>
                            <input type="text" name="name" required class="form-control" placeholder="Your full name"/>
                        </div>
                        <div class="col-md-6">
                            <label>Date of Birth *</label>
                            <input type="date" name="dob" required class="form-control"/>
                        </div>
                        <div class="col-md-12">
                            <label>Gender *</label>
                            <div style="display:flex;gap:20px;margin-bottom:14px;align-items:center;font-size:0.9rem;">
                                <label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer;"><input type="radio" name="gender" value="male"/> Male</label>
                                <label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer;"><input type="radio" name="gender" value="female"/> Female</label>
                                <label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer;"><input type="radio" name="gender" value="other"/> Other</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label>Mobile Number *</label>
                            <input type="number" name="mobile" required class="form-control" placeholder="+91 XXXXX XXXXX"/>
                        </div>
                        <div class="col-md-6">
                            <label>Email Address *</label>
                            <input type="email" name="email" required class="form-control" placeholder="you@example.com"/>
                        </div>
                        <div class="col-md-6">
                            <label>Password *</label>
                            <input type="password" name="passwd" required class="form-control" placeholder="Choose a strong password"/>
                        </div>
                        <div class="col-md-6">
                            <label>Confirm Password *</label>
                            <input type="password" name="cpasswd" required class="form-control" placeholder="Re-enter your password"/>
                        </div>
                        <div class="col-md-6">
                            <label>Highest Qualification *</label>
                            <input type="text" name="qualification" required class="form-control" placeholder="e.g. B.Tech, M.Sc"/>
                        </div>
                        <div class="col-md-6">
                            <label>Profession *</label>
                            <input type="text" name="profession" required class="form-control" placeholder="e.g. Student, Teacher"/>
                        </div>
                        <div class="col-md-6">
                            <label>City *</label>
                            <input type="text" name="city" required class="form-control" placeholder="Your city"/>
                        </div>
                        <div class="col-md-6">
                            <label>Profile Picture *</label>
                            <input type="file" name="pp" required class="form-control" accept="image/*"/>
                        </div>
                        <div class="col-12">
                            <label>Address *</label>
                            <textarea class="form-control" name="address" style="min-height:80px;resize:vertical;" placeholder="Full address" required></textarea>
                        </div>
                        <div class="col-12">
                            <label>Display Profile Publicly</label>
                            <div style="display:flex;gap:20px;align-items:center;font-size:0.9rem;">
                                <label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer;"><input type="radio" name="dp" value="yes"/> Yes</label>
                                <label style="display:flex;align-items:center;gap:6px;font-weight:400;cursor:pointer;"><input type="radio" name="dp" value="no"/> No</label>
                            </div>
                        </div>
                        <div class="col-12 d-flex gap-3 mt-2">
                            <button type="submit" class="btn-warning btn" style="flex:1;padding:12px;font-size:1rem;">
                                <i class="fa fa-user-plus"></i> Create Account
                            </button>
                            <a href="/senior/signin/" class="btn btn-outline-secondary" style="flex:1;padding:12px;font-size:1rem;border-radius:10px;text-align:center;">
                                Already have an account?
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
