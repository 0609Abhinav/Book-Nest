{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="bn-page-hero">
    <h1><i class="fa fa-key"></i> Forgot <span class="gold">Password</span></h1>
    <p>Enter your email to receive a password reset code.</p>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="bn-form-card">
                <h4 style="font-weight:800;color:var(--navy,#0d1b2a);margin-bottom:24px;text-align:center;">
                    <i class="fa fa-envelope" style="color:var(--teal,#00b4d8);"></i> Reset Password
                </h4>
                
                {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endfor %}
                {% endif %}

                <form method="post" autocomplete="off">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label>Registered Email Address *</label>
                        <input type="email" name="email" required class="form-control" placeholder="you@example.com">
                    </div>
                    
                    <button type="submit" class="btn-primary btn w-100" style="padding:12px;font-size:1rem;background:var(--teal,#00b4d8);color:white;border:none;border-radius:10px;">
                        <i class="fa fa-paper-plane"></i> Send OTP Code
                    </button>
                </form>
                
                <div class="text-center mt-4">
                    <a href="{% url 'signin' %}" class="text-muted text-decoration-none">← Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
